<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoAlpha</title>
<style>
:root{
  --bg:#0a0e17; --bg2:#111827; --card:#151d2e; --card2:#1b2437;
  --line:#243049; --fg:#e8edf7; --fg2:#8da2c4;
  --acc:#4f8cff; --acc2:#7c5cff; --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;
  -webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 12% -5%,rgba(79,140,255,.13),transparent 60%),
             radial-gradient(700px 500px at 88% 0%,rgba(124,92,255,.11),transparent 60%)}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:28px 20px 80px}

header{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.logo{width:38px;height:38px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;
  box-shadow:0 6px 22px rgba(79,140,255,.4)}
h1{font-size:21px;margin:0;letter-spacing:.3px}
.sub{color:var(--fg2);font-size:13px;margin:2px 0 24px 52px}

/* 输入区 */
.hero{background:linear-gradient(180deg,var(--card),var(--bg2));
  border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:22px}
.hero h2{margin:0 0 14px;font-size:15px;font-weight:600}
.inputRow{display:flex;gap:10px;flex-wrap:wrap}
input[type=text]{flex:1;min-width:260px;background:#0d1320;border:1px solid var(--line);
  color:var(--fg);padding:13px 15px;border-radius:10px;font-size:14px;outline:none;transition:.18s}
input[type=text]:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(79,140,255,.16)}
button{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;
  padding:13px 22px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;
  transition:.18s;white-space:nowrap}
button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 7px 20px rgba(79,140,255,.34)}
button:disabled{opacity:.42;cursor:not-allowed}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--fg2)}
button.ghost:hover:not(:disabled){border-color:var(--acc);color:var(--fg);box-shadow:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{background:#0d1320;border:1px solid var(--line);color:var(--fg2);padding:6px 12px;
  border-radius:20px;font-size:12px;cursor:pointer;transition:.16s}
.chip:hover{border-color:var(--acc);color:var(--fg)}

/* 阶段条 */
.steps{display:flex;gap:6px;margin-bottom:22px;overflow-x:auto;padding-bottom:4px}
.step{flex:1;min-width:92px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;transition:.25s;position:relative;overflow:hidden}
.step .n{font-size:10px;color:var(--fg2);letter-spacing:1.2px;text-transform:uppercase}
.step .t{font-size:13px;margin-top:3px;font-weight:500}
.step.active{border-color:var(--acc);background:linear-gradient(180deg,rgba(79,140,255,.14),var(--card))}
.step.active .t{color:var(--acc)}
.step.active::after{content:'';position:absolute;left:0;bottom:0;height:2px;width:100%;
  background:linear-gradient(90deg,var(--acc),var(--acc2));animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.step.done{border-color:rgba(34,197,94,.42)}
.step.done .t{color:var(--ok)}
.step.done .n::after{content:' ✓'}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:18px;margin-bottom:16px;animation:fade .32s ease}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.card h3{margin:0 0 13px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .badge{background:rgba(79,140,255,.18);color:var(--acc);font-size:11px;
  padding:2px 8px;border-radius:5px;font-weight:600}

/* 列表项 */
.item{background:var(--card2);border:1px solid var(--line);border-radius:10px;
  padding:13px;margin-bottom:9px;cursor:pointer;transition:.16s;display:flex;gap:11px}
.item:hover{border-color:var(--acc)}
.item.sel{border-color:var(--acc);background:rgba(79,140,255,.1)}
.item .box{width:17px;height:17px;border:1.5px solid var(--line);border-radius:4px;flex:none;
  margin-top:2px;display:grid;place-items:center;font-size:11px;transition:.16s}
.item.sel .box{background:var(--acc);border-color:var(--acc);color:#fff}
.item .bd{flex:1;min-width:0}
.item .ti{font-size:13px;font-weight:500;margin-bottom:4px;line-height:1.45}
.item .me{font-size:11px;color:var(--fg2);line-height:1.6}
.item .ab{font-size:11.5px;color:var(--fg2);margin-top:6px;line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
code{font-family:var(--mono);font-size:11px;background:#0d1320;padding:1px 5px;
  border-radius:4px;color:var(--acc)}
.zh{font-size:12px;color:#c4d3ec;line-height:1.75;margin-top:7px;padding:8px 10px;
  background:rgba(79,140,255,.07);border-left:2px solid var(--acc);border-radius:0 6px 6px 0}
.zh.rel{background:rgba(124,92,255,.07);border-left-color:var(--acc2);margin-top:5px}
.zh b{color:var(--acc);font-weight:600;margin-right:6px;font-size:11px}
.srcline{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.badge2{font-size:10px;padding:2px 7px;border-radius:4px;background:#0d1320;
  border:1px solid var(--line);color:var(--fg2);font-family:var(--mono)}
.badge2.src{color:var(--acc2);border-color:rgba(124,92,255,.35)}
.badge2.dt-report{color:var(--warn);border-color:rgba(245,158,11,.4)}
.badge2.dt-working_paper{color:var(--ok);border-color:rgba(34,197,94,.35)}
.badge2.dt-paper{color:var(--acc);border-color:rgba(79,140,255,.35)}
.tagchip{font-size:11px;padding:3px 9px;border-radius:12px;background:#0d1320;
  border:1px solid var(--line);color:var(--fg2)}
.tagchip b{color:var(--fg);margin-left:3px}
.kvlabel{font-size:10.5px;color:var(--fg2);text-transform:uppercase;letter-spacing:.5px}
.srcbox{font-size:11.5px;color:var(--fg2);display:inline-flex;align-items:center;
  gap:5px;padding:5px 10px;background:#0d1320;border:1px solid var(--line);
  border-radius:7px;cursor:pointer}
.srcbox input{accent-color:var(--acc)}

/* 顶栏配置按钮 */
.iconbtn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;font-size:12.5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--fg2);flex:none;
  box-shadow:0 0 0 0 rgba(34,197,94,.55)}
.dot.on{background:var(--ok);animation:pulse 2.4s ease-out infinite}
.dot.off{background:var(--bad)}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}
  70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}
  100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}

/* 弹窗 */
.mask{display:none;position:fixed;inset:0;z-index:50;background:rgba(5,8,14,.72);
  backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:20px}
.mask.show{display:flex;animation:fade .2s ease}
.modal{background:linear-gradient(180deg,var(--card),var(--bg2));
  border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;
  max-width:470px;box-shadow:0 24px 60px rgba(0,0,0,.5);animation:rise .24s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.modal h3{margin:0 0 16px;font-size:15px}
.mrow{margin-bottom:12px}
.mrow2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.modal label{display:block;font-size:10.5px;color:var(--fg2);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:5px}
.modal input{width:100%;background:#0d1320;border:1px solid var(--line);color:var(--fg);
  padding:10px 12px;border-radius:8px;font-size:13px;outline:none;transition:.16s;
  font-family:var(--mono)}
.modal input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(79,140,255,.15)}
.cfgmsg{font-size:11.5px;margin-top:10px;line-height:1.6;font-family:var(--mono)}
.cfgmsg.ok{color:var(--ok)} .cfgmsg.err{color:var(--bad)} .cfgmsg.wait{color:var(--fg2)}

/* 步骤条：完成态的连接线 */
.step.done::before{content:'';position:absolute;left:0;top:0;height:2px;width:100%;
  background:linear-gradient(90deg,var(--ok),rgba(34,197,94,.25))}

/* 卡片悬停微反馈 */
.fx{transition:border-color .18s,transform .18s}
.fx:hover{border-color:#2f3e5c;transform:translateY(-1px)}

/* 数值滚动入场 */
.kv .v{animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.zh.rel b{color:var(--acc2)}
.usage{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--fg2);
  font-family:var(--mono);margin-top:10px;padding:9px 11px;background:#0d1320;
  border:1px solid var(--line);border-radius:8px}
.usage b{color:var(--fg);font-weight:600}

/* 数据栅格 */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px}
.kv{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:11px}
.kv .k{font-size:10.5px;color:var(--fg2);text-transform:uppercase;letter-spacing:.5px}
.kv .v{font-size:17px;font-weight:650;margin-top:4px;font-family:var(--mono)}
.kv .v.ok{color:var(--ok)} .kv .v.bad{color:var(--bad)} .kv .v.warn{color:var(--warn)}

/* 因子结果 */
.fx{background:var(--card2);border:1px solid var(--line);border-radius:12px;
  padding:15px;margin-bottom:12px}
.fx.pass{border-left:3px solid var(--ok)}
.fx.fail{border-left:3px solid var(--bad)}
.fx.skip{border-left:3px solid var(--fg2);opacity:.78}
.tag.skip{background:rgba(141,162,196,.17);color:var(--fg2)}
.fx .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;
  flex-wrap:wrap;margin-bottom:12px}
.fx .nm{font-size:14px;font-weight:600;font-family:var(--mono)}
.fxdesc{font-size:12px;color:var(--fg2);line-height:1.65;margin:-4px 0 11px;
  padding-left:10px;border-left:2px solid var(--line)}
.tag{font-size:11px;padding:3px 10px;border-radius:5px;font-weight:600}
.tag.pass{background:rgba(34,197,94,.17);color:var(--ok)}
.tag.fail{background:rgba(239,68,68,.17);color:var(--bad)}
.reason{font-size:11.5px;color:var(--warn);background:rgba(245,158,11,.1);
  border-radius:7px;padding:9px 11px;margin-top:10px;line-height:1.6;font-family:var(--mono)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}
@media(max-width:700px){.cmp{grid-template-columns:1fr}}
.pane{background:#0d1320;border:1px solid var(--line);border-radius:9px;padding:11px}
.pane .ph{font-size:10.5px;color:var(--fg2);text-transform:uppercase;letter-spacing:.7px;
  margin-bottom:8px;display:flex;justify-content:space-between}
.row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;font-family:var(--mono)}
.row span:first-child{color:var(--fg2)}

/* 分层条 */
.bars{display:flex;align-items:flex-end;gap:5px;height:62px;margin-top:10px}
.bar{flex:1;border-radius:4px 4px 0 0;position:relative;min-height:2px;
  background:linear-gradient(180deg,var(--acc),rgba(79,140,255,.3));transition:.3s}
.bar.neg{background:linear-gradient(0deg,var(--bad),rgba(239,68,68,.3))}
.bar .lb{position:absolute;bottom:-17px;left:0;right:0;text-align:center;
  font-size:9.5px;color:var(--fg2);font-family:var(--mono)}
.barWrap{padding-bottom:20px}

/* 日志 */
.logs{background:#080c14;border:1px solid var(--line);border-radius:10px;
  padding:12px;max-height:210px;overflow-y:auto;font-family:var(--mono);font-size:11.5px}
.log{padding:2px 0;color:var(--fg2);line-height:1.65;display:flex;gap:8px}
.log .tm{color:#44557a;flex:none}
.log.err{color:var(--bad)}
.log.ok{color:var(--ok)}

.empty{text-align:center;padding:34px 16px;color:var(--fg2);font-size:13px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);
  border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;
  vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
.bChart{width:100%;height:116px;display:block}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
.note{font-size:11.5px;color:var(--fg2);line-height:1.65;margin-top:9px;
  padding:9px 11px;background:rgba(79,140,255,.07);border-radius:7px;border-left:2px solid var(--acc)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">α</div>
    <div style="flex:1"><h1>AutoAlpha</h1></div>
    <button class="ghost iconbtn" onclick="openCfg()" title="LLM 配置">
      <span id="cfgDot" class="dot"></span>LLM 配置
    </button>
  </header>
  <div class="sub">研究方向 → 论文检索 → 因子假设 → 实现 → IS/OOS 双层回测 → 因子库</div>

  <div class="hero">
    <h2>输入研究方向</h2>
    <div class="inputRow">
      <input id="idea" type="text" placeholder="例如：基于动量的ETF轮动因子" autocomplete="off">
      <button id="btnStep" onclick="start('stepwise')">分步运行</button>
      <button id="btnAuto" class="ghost" onclick="start('auto')">全自动</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div id="cfgMask" class="mask" onclick="if(event.target===this)closeCfg()">
  <div class="modal">
    <h3>LLM 配置</h3>
    <div class="mrow">
      <label>API Key</label>
      <input id="cfgKey" type="password" placeholder="留空则保持当前密钥" autocomplete="off">
    </div>
    <div class="mrow">
      <label>模型 ID</label>
      <input id="cfgModel" type="text" placeholder="如 claude-sonnet-4-6 / gpt-4o" autocomplete="off">
    </div>
    <div class="mrow">
      <label>Base URL</label>
      <input id="cfgBase" type="text" placeholder="OpenAI 兼容端点，留空用默认" autocomplete="off">
    </div>
    <div class="mrow2">
      <div><label>输入单价 $/M</label><input id="cfgPin" type="text" placeholder="3.0"></div>
      <div><label>输出单价 $/M</label><input id="cfgPout" type="text" placeholder="15.0"></div>
    </div>
    <div class="note">配置只存在于当前服务进程，不落盘。重启后需重新设置，
      或在启动前用 <code>LLM_API_KEY</code> / <code>LLM_MODEL</code> 环境变量。</div>
    <div id="cfgMsg" class="cfgmsg"></div>
    <div class="actions">
      <button onclick="saveCfg()">保存</button>
      <button class="ghost" onclick="testCfg()">测试连通</button>
      <button class="ghost" onclick="closeCfg()">关闭</button>
    </div>
  </div>
</div>

<div class="steps" id="steps"></div>
  <div id="panels"></div>

  <div class="card">
    <h3>灵感池 <span class="badge" id="feedBadge">未加载</span></h3>
    <div style="font-size:11.5px;color:var(--fg2);line-height:1.65;margin-bottom:9px">
      量化博客与机构最新文章（AlphaArchitect / Quantpedia / QuantInsti / NBER）。
      RSS 不支持按词检索，所以先抓取入库，再本地筛选。
    </div>
    <div class="actions" style="margin-top:0">
      <button class="ghost" onclick="refreshFeeds()">抓取最新</button>
      <button class="ghost" onclick="loadFeeds()">查看</button>
      <button class="ghost" onclick="suggestFeeds()">按当前意图筛选</button>
    </div>
    <div id="feedList"></div>
  </div>

  <div class="card">
    <h3>Token 用量</h3>
    <div id="usageBox"><div class="empty" style="padding:14px;font-size:12px">尚未调用</div></div>
  </div>

  <div class="card">
    <h3>运行日志</h3>
    <div class="logs" id="logs"><div class="empty">等待开始…</div></div>
  </div>
</div>

<script>
const STEPS=[['intent','意图识别'],['search','资料检索'],['data','数据切分'],
             ['extract','因子假设'],['implement','代码实现'],['evaluate','双层回测'],
             ['done','完成']];
const EXAMPLES=['基于动量的ETF轮动因子','波动率择时信号','量价背离反转因子','跨资产动量溢出'];
let SID=null, ES=null, papers=[], specs=[], selP=new Set(), selS=new Set(), evals=[];
let paperMore=false, paperPage=1, paperTotal=0, INTENT=null;
let stageState={};

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(v,d=3)=>v==null||isNaN(v)?'—':Number(v).toFixed(d);
const pct=v=>v==null||isNaN(v)?'—':(Number(v)*100).toFixed(2)+'%';

loadCfg();
$('chips').innerHTML=EXAMPLES.map(e=>`<div class="chip" onclick="$('idea').value='${e}'">${e}</div>`).join('');
$('idea').addEventListener('keydown',e=>{if(e.key==='Enter')start('stepwise')});

function renderSteps(){
  $('steps').innerHTML=STEPS.map(([k,t],i)=>{
    const st=stageState[k]||'';
    return `<div class="step ${st}"><div class="n">Step ${i+1}</div><div class="t">${t}</div></div>`;
  }).join('');
}
renderSteps();

function log(msg,cls=''){
  const box=$('logs');
  if(box.querySelector('.empty'))box.innerHTML='';
  const tm=new Date().toLocaleTimeString('zh-CN',{hour12:false});
  box.insertAdjacentHTML('beforeend',
    `<div class="log ${cls}"><span class="tm">${tm}</span><span>${esc(msg)}</span></div>`);
  box.scrollTop=box.scrollHeight;
}

async function start(mode){
  const idea=$('idea').value.trim();
  if(!idea){$('idea').focus();return}
  $('btnStep').disabled=$('btnAuto').disabled=true;
  papers=[];specs=[];evals=[];selP.clear();selS.clear();stageState={};
  $('panels').innerHTML='';$('logs').innerHTML='';renderSteps();
  log('启动：'+idea);
  try{
    const r=await fetch('/api/start',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({idea,mode})});
    const j=await r.json();
    SID=j.session_id;
    log('会话 '+SID+'（'+(mode==='auto'?'全自动':'分步')+'）');
    connect();
  }catch(e){log('启动失败：'+e,'err');$('btnStep').disabled=$('btnAuto').disabled=false}
}

function connect(){
  if(ES)ES.close();
  ES=new EventSource('/api/events/'+SID);
  ES.onmessage=e=>{
    let d;try{d=JSON.parse(e.data)}catch{return}
    if(d.kind==='idle')return;
    handle(d);
  };
  ES.onerror=()=>log('事件流中断','err');
}

function handle(ev){
  const {kind,stage,message,payload}=ev;
  if(kind==='stage_start'){stageState[stage]='active';renderSteps();log('▶ '+message)}
  else if(kind==='stage_end'){
    stageState[stage]='done';
    if(payload&&payload.usage)showUsage(payload.usage);
    if(stage==='done'){STEPS.forEach(([k])=>{if(stageState[k]==='active')stageState[k]='done'});
      $('btnStep').disabled=$('btnAuto').disabled=false}
    renderSteps();log('✓ '+message,'ok');
    if(payload&&payload.can_extend)showExtend();
  }
  else if(kind==='progress')log('  '+message);
  else if(kind==='log')log('  '+message);
  else if(kind==='error'){log('✗ '+message,'err');$('btnStep').disabled=$('btnAuto').disabled=false}
  else if(kind==='await_input'){
    log('⏸ '+message);
    if(payload.next==='search')showIntent(true);
    if(payload.next==='select')showPapers();
    if(payload.next==='run')showSpecs();
  }
  else if(kind==='data'){
    if(payload.intent){INTENT=payload.intent; showIntent();}
    if(payload.papers){
      if(payload.page&&payload.page>1){
        const seen=new Set(papers.map(p=>p.idx));
        const fresh=payload.papers.filter(p=>!seen.has(p.idx));
        if(fresh.length)papers=papers.concat(fresh);
        else log('  没有更多论文了');
      } else if(payload.papers.length)papers=payload.papers;
      paperMore=!!payload.has_more; paperPage=payload.page||1; paperTotal=payload.total||papers.length;
      log('  '+payload.papers.length+' 篇论文'+(paperTotal>papers.length?` (已加载 ${papers.length}/${paperTotal})`:''));
      if($('pPapers'))showPapers();
    }
    if(payload.specs&&stage==='extract'){
      if(payload.append){
        const seen=new Set(specs.map(s=>s.idx));
        specs=specs.concat(payload.specs.filter(s=>!seen.has(s.idx)));
      } else specs=payload.specs;
    }
    if(payload.specs&&stage==='extend'){log('  延伸：'+payload.specs.map(s=>s.factor_name).join(', '))}
    if(payload.n_symbols!==undefined)showData(payload);
    if(payload.evaluation){evals.push(payload.evaluation);showEvals()}
  }
}

function panel(id,html){
  let el=$(id);
  if(!el){$('panels').insertAdjacentHTML('beforeend',`<div class="card" id="${id}"></div>`);el=$(id)}
  el.innerHTML=html;
  return el;
}

function showData(p){
  const ex=(p.excluded||[]).length
    ? `<div class="note">截面池 <code>${esc(p.preset||'equity')}</code>：
       从 ${p.n_total} 只中保留 <b>${p.n_symbols}</b> 只，
       排除 <code>${(p.excluded||[]).join(', ')}</code>。
       异质资产（债券波动~2% vs 股票~25%）同池排序会让结果被资产类别主导，
       而非因子强弱。</div>` : '';
  panel('pData',`<h3>数据与样本切分 <span class="badge">${p.n_symbols} 标的</span></h3>
  <div class="grid">
    <div class="kv"><div class="k">交易日</div><div class="v">${p.n_days}</div></div>
    <div class="kv"><div class="k">截面宽度</div><div class="v">${p.universe_width}</div></div>
    <div class="kv"><div class="k">IS 天数</div><div class="v">${p.is_days}</div></div>
    <div class="kv"><div class="k">OOS 天数</div><div class="v">${p.oos_days}</div></div>
    <div class="kv"><div class="k">IC 门槛</div><div class="v">${fmt(p.ic_mean_floor,4)}</div></div>
    <div class="kv"><div class="k">t 门槛</div><div class="v">${fmt(p.t_threshold,2)}</div></div>
  </div>
  ${ex}
  <div class="note">样本内 <code>${p.is_range[0]} ~ ${p.is_range[1]}</code>，
  禁运 21 日后样本外 <code>${p.oos_range[0]} ~ ${p.oos_range[1]}</code>。
  IC 门槛由截面宽度推导（<code>t/√n/√width</code>），不是硬编码常量。</div>`);
}

function showIntent(editable){
  if(!INTENT)return;
  const i=INTENT, conf=(i.confidence*100).toFixed(0);
  const warn=i.confidence<0.5
    ? `<div class="note" style="border-left-color:var(--warn)">
       置信度偏低（${conf}%），建议补充研究方向，或直接修改下面的检索式。</div>` : '';
  const chips=[['资产',i.asset_class],['因子族',i.factor_family],
               ['周期',i.horizon],['文献偏好',i.doc_preference]]
    .filter(x=>x[1]&&x[1]!=='unknown')
    .map(x=>`<span class="tagchip">${x[0]} <b>${esc(x[1])}</b></span>`).join('');
  panel('pIntent',`<h3>Step 1 · 研究意图 <span class="badge">置信度 ${conf}%</span></h3>
    ${i.restated_zh?`<div class="zh"><b>理解为</b>${esc(i.restated_zh)}</div>`:''}
    <div style="margin-top:10px">
      <div class="kvlabel">检索式（可改）</div>
      <input id="canonEn" type="text" value="${esc(i.canonical_en)}"
             style="width:100%;margin-top:5px">
    </div>
    ${i.aliases&&i.aliases.length?`<div style="margin-top:9px">
      <div class="kvlabel">同义表述（一并检索）</div>
      <div class="chips" style="margin-top:5px">${
        i.aliases.map(a=>`<span class="tagchip">${esc(a)}</span>`).join('')}</div></div>`:''}
    <div class="chips" style="margin-top:10px">${chips}</div>
    ${warn}
    ${editable?`<div style="margin-top:12px">
      <div class="kvlabel">检索源</div>
      <div class="chips" style="margin-top:6px">
        ${['arxiv','openalex','crossref'].map(sname=>
          `<label class="srcbox"><input type="checkbox" class="srcck" value="${sname}" checked>
           ${({arxiv:'arXiv 预印本',openalex:'OpenAlex 期刊+研报',crossref:'Crossref 期刊+SSRN'})[sname]}</label>`
        ).join('')}
      </div></div>
      <div class="actions"><button onclick="startSearch()">开始检索</button></div>`:''}`);
}

async function startSearch(){
  const el=$('canonEn');
  const patch=el?{canonical_en:el.value.trim()}:{};
  const srcs=[...document.querySelectorAll?.('.srcck')||[]];
  log('开始多源检索：'+(patch.canonical_en||''));
  await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({session_id:SID,intent:patch})});
}

function showPapers(){
  if(!papers.length){
    panel('pPapers',`<h3>论文检索</h3><div class="empty">未找到相关论文，将直接基于研究方向生成假设</div>
      <div class="actions"><button onclick="submitSel()">继续</button></div>`);
    return;
  }
  const badge=paperTotal>papers.length?`${papers.length}/${paperTotal} 篇`:`${papers.length} 篇`;
  panel('pPapers',`<h3>选择论文 <span class="badge">${badge}</span></h3>
    <div id="pList"></div>
    <div class="actions">
      <button onclick="submitSel()">提取因子假设</button>
      ${paperMore?`<button class="ghost" onclick="morePapers()">加载下一批</button>`:''}
      <button class="ghost" onclick="selP.clear();submitSel()">跳过，用原始想法</button>
    </div>`);
  drawPapers();
}
function drawPapers(){
  $('pList').innerHTML=papers.map(p=>`
    <div class="item ${selP.has(p.idx)?'sel':''}" onclick="togP(${p.idx})">
      <div class="box">${selP.has(p.idx)?'✓':''}</div>
      <div class="bd"><div class="ti">${esc(p.title)}</div>
      <div class="me">${esc(p.date||'')} ${p.url?'· <code>'+esc(p.url)+'</code>':''}</div>
      <div class="srcline">${srcBadge(p)}</div>
      ${p.zh_summary?`<div class="zh"><b>概述</b>${esc(p.zh_summary)}</div>`:''}
      ${p.zh_relevance?`<div class="zh rel"><b>相关性</b>${esc(p.zh_relevance)}</div>`:''}
      ${p.abstract?`<div class="ab">${esc(p.abstract)}</div>`:''}</div></div>`).join('');
}
function togP(i){selP.has(i)?selP.delete(i):selP.add(i);drawPapers()}

const DOC_LABEL={paper:'期刊论文',report:'研报',working_paper:'SSRN工作论文',
                 preprint:'预印本',thesis:'学位论文',book:'书籍章节'};
function srcBadge(p){
  const out=[];
  if(p.doc_type)out.push(`<span class="badge2 dt-${p.doc_type}">${DOC_LABEL[p.doc_type]||p.doc_type}</span>`);
  if(p.venue)out.push(`<span class="badge2">${esc(p.venue.slice(0,30))}</span>`);
  if(p.citations>0)out.push(`<span class="badge2">被引 ${p.citations}</span>`);
  const srcs=[p.source,...(p.also_in||[])].filter(Boolean);
  if(srcs.length)out.push(`<span class="badge2 src">${srcs.join(' + ')}</span>`);
  return out.join('');
}

async function morePapers(){
  log('加载第 '+(paperPage+1)+' 批论文');
  await fetch('/api/more_papers',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({session_id:SID,page:paperPage+1})});
}

async function submitSel(append){
  log('提交选择：'+(selP.size?[...selP].map(i=>i+1).join(','):'无（用原始想法）')
      +(append?'（追加）':''));
  await fetch('/api/select',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({session_id:SID,paper_indices:[...selP],append:!!append})});
}

function showSpecs(){
  if(!specs.length){panel('pSpecs',`<h3>因子假设</h3><div class="empty">未提取到假设</div>`);return}
  selS=new Set(specs.map(s=>s.idx!==undefined?s.idx:specs.indexOf(s)));
  panel('pSpecs',`<h3>因子假设 <span class="badge">${specs.length} 个</span></h3>
    <div id="sList"></div>
    <div class="actions"><button onclick="submitRun()">实现并回测</button>
    <button class="ghost" onclick="backToPapers()">再选论文，追加假设</button>
    <button class="ghost" onclick="selS.clear();drawSpecs()">全不选</button></div>`);
  drawSpecs();
}
function drawSpecs(){
  $('sList').innerHTML=specs.map((s,i)=>{
    const idx=s.idx!==undefined?s.idx:i;
    const zh=[s.zh_what&&`<b>衡量</b>${esc(s.zh_what)}`,
              s.zh_why&&`<b>逻辑</b>${esc(s.zh_why)}`,
              s.zh_how&&`<b>算法</b>${esc(s.zh_how)}`].filter(Boolean);
    return `<div class="item ${selS.has(idx)?'sel':''}" onclick="togS(${idx})">
      <div class="box">${selS.has(idx)?'✓':''}</div>
      <div class="bd"><div class="ti"><code>${esc(s.factor_name)}</code></div>
      ${zh.length?`<div class="zh">${zh.join('<br>')}</div>`
                 :`<div class="ab">${esc(s.hypothesis||s.description||'')}</div>`}
      ${s.formula?`<div class="me" style="margin-top:5px"><code>${esc(s.formula)}</code></div>`:''}
      </div></div>`}).join('');
}
function togS(i){selS.has(i)?selS.delete(i):selS.add(i);drawSpecs()}

async function submitRun(){
  if(!selS.size){log('未选择任何因子','err');return}
  log('开始实现 '+selS.size+' 个因子');
  await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({session_id:SID,spec_indices:[...selS]})});
}

function backToPapers(){
  selP.clear(); showPapers();
  const el=$('pPapers');
  if(el)el.innerHTML=el.innerHTML.replace('>提取因子假设<','>追加这些论文的假设<')
    .replace('submitSel()','submitSel(true)');
  log('选择更多论文以追加因子假设');
}

function showExtend(){
  panel('pExt',`<h3>因子延伸</h3>
    <div class="note">已有因子通过双层门控，可基于它们生成结构化延伸变体。</div>
    <div class="actions"><button onclick="doExtend()">生成延伸假设</button></div>`);
}
async function doExtend(){
  log('生成延伸假设');
  await fetch('/api/extend',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({session_id:SID})});
}

// ── LLM 配置 ────────────────────────────────────────────────────────────
let CFG=null;

async function loadCfg(){
  try{
    CFG=await (await fetch('/api/llm/config')).json();
    const d=$('cfgDot');
    if(d)d.className='dot '+(CFG.has_key&&CFG.model?'on':'off');
    return CFG;
  }catch(e){return null}
}

function openCfg(){
  loadCfg().then(c=>{
    if(c){
      $('cfgKey').value='';
      $('cfgKey').placeholder=c.has_key?`当前 ${c.key_masked}（留空不改）`:'必填';
      $('cfgModel').value=c.model||'';
      $('cfgBase').value=c.base_url||'';
      $('cfgPin').value=c.price_input||'';
      $('cfgPout').value=c.price_output||'';
    }
    cfgMsg('', '');
    $('cfgMask').classList.add('show');
  });
}
function closeCfg(){$('cfgMask').classList.remove('show')}
function cfgMsg(t,cls){const e=$('cfgMsg');if(e){e.textContent=t;e.className='cfgmsg '+(cls||'')}}

async function saveCfg(){
  const body={
    model:$('cfgModel').value.trim(),
    base_url:$('cfgBase').value.trim(),
  };
  const k=$('cfgKey').value.trim();
  if(k)body.api_key=k;
  const pin=parseFloat($('cfgPin').value), pout=parseFloat($('cfgPout').value);
  if(!isNaN(pin))body.price_input=pin;
  if(!isNaN(pout))body.price_output=pout;
  if(!body.model){cfgMsg('请填写模型 ID','err');return}

  cfgMsg('保存中…','wait');
  try{
    const r=await fetch('/api/llm/config',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();
    if(!r.ok){cfgMsg(j.detail||'保存失败','err');return}
    CFG=j; $('cfgKey').value='';
    const d=$('cfgDot'); if(d)d.className='dot on';
    cfgMsg('已保存，对后续会话生效','ok');
    log('LLM 配置已更新：'+(j.model||''));
  }catch(e){cfgMsg('保存失败：'+e,'err')}
}

async function testCfg(){
  cfgMsg('测试中…','wait');
  try{
    const r=await fetch('/api/llm/test',{method:'POST'});
    const j=await r.json();
    if(!r.ok){cfgMsg(j.detail||'调用失败','err');return}
    cfgMsg(`连通正常 · 延迟 ${j.latency_ms}ms · 回复 "${j.reply}"`,'ok');
  }catch(e){cfgMsg('测试失败：'+e,'err')}
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeCfg();
});

async function refreshFeeds(){
  log('抓取 RSS 灵感池…');
  try{
    const r=await (await fetch('/api/feeds/refresh',{method:'POST'})).json();
    log(`灵感池：抓取 ${r.fetched} 条，新增 ${r.added} 条`);
    renderFeeds(null,r);
    loadFeeds();
  }catch(e){log('灵感池抓取失败：'+e,'err')}
}

  const r=await (await fetch('/api/feeds',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({keywords:kws||null,limit:20})})).json();
  renderFeeds(r.items,r);

async function suggestFeeds(){
  if(!SID){log('先开始一个研究会话','err');return}
  const r=await (await fetch('/api/feeds/suggest/'+SID)).json();
  log(`按意图筛选灵感池：${(r.items||[]).length} 条`);
  renderFeeds(r.items);
}

function renderFeeds(items,stat){
  if(stat&&$('feedBadge'))
    $('feedBadge').textContent=`${stat.total||0} 条`;
  if(!items)return;
  const el=$('feedList');
  if(!items.length){el.innerHTML='<div class="empty" style="padding:16px;font-size:12px">暂无条目，先点「抓取最新」</div>';return}
  el.innerHTML=items.map(it=>`
    <div class="item" style="cursor:default">
      <div class="bd">
        <div class="ti">${esc(it.title)}</div>
        <div class="srcline">
          <span class="badge2 src">${esc(it.source_label||it.feed||'')}</span>
          ${it.published?`<span class="badge2">${esc(it.published)}</span>`:''}
          ${it.url?`<span class="badge2"><a href="${esc(it.url)}" target="_blank"
            rel="noopener" style="color:inherit">原文 ↗</a></span>`:''}
        </div>
        ${it.summary?`<div class="ab">${esc(it.summary)}</div>`:''}
      </div></div>`).join('');
}

function showUsage(u){
  if(!u||!u.calls)return;
  const cost=u.priced?`$${u.cost_usd.toFixed(4)}`:'未计价';
  const bp=Object.entries(u.by_purpose||{})
    .sort((a,b)=>(b[1].input+b[1].output)-(a[1].input+a[1].output))
    .map(([k,v])=>`${k} ${((v.input+v.output)/1000).toFixed(1)}k`).join(' · ');
  const el=$('usageBox');
  if(el)el.innerHTML=`<div class="usage">
    <span>调用 <b>${u.calls}</b></span>
    <span>输入 <b>${(u.input_tokens/1000).toFixed(1)}k</b></span>
    <span>输出 <b>${(u.output_tokens/1000).toFixed(1)}k</b></span>
    <span>合计 <b>${(u.total_tokens/1000).toFixed(1)}k</b></span>
    <span>花费 <b>${cost}</b></span>
    ${bp?`<span style="flex-basis:100%;opacity:.75">${bp}</span>`:''}</div>`;
}

function sparkline(pts){
  if(!pts||pts.length<2)return '';
  const W=560,H=116,P=4;
  const vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),sp=(mx-mn)||1;
  const x=i=>P+i*(W-2*P)/(pts.length-1), y=v=>H-P-(v-mn)/sp*(H-2*P);
  const d=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const up=vs[vs.length-1]>=vs[0], col=up?'#22c55e':'#ef4444';
  const y1=y(1.0), base=(y1>=P&&y1<=H-P)?`<line x1="${P}" y1="${y1.toFixed(1)}" x2="${W-P}" y2="${y1.toFixed(1)}" stroke="#243049" stroke-width="1" stroke-dasharray="3 3"/>`:'';
  return `<svg class="bChart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="g${Math.random().toString(36).slice(2,7)}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${col}" stop-opacity=".28"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/>
    </linearGradient></defs>
    ${base}<path d="${d}" fill="none" stroke="${col}" stroke-width="1.8"/></svg>`;
}

function bars(vals){
  if(!vals||!vals.length)return '';
  const mx=Math.max(...vals.map(Math.abs))||1;
  return `<div class="barWrap"><div class="bars">${vals.map((v,i)=>
    `<div class="bar ${v<0?'neg':''}" style="height:${Math.max(2,Math.abs(v)/mx*58)}px">
      <div class="lb">Q${i+1}</div></div>`).join('')}</div></div>`;
}

function pane(title,ic,lm,extra=''){
  if(!ic&&!lm)return `<div class="pane"><div class="ph"><span>${title}</span></div>
    <div class="empty" style="padding:14px;font-size:12px">未进入此阶段</div></div>`;
  const ls=lm&&lm.long_short?lm.long_short:null;
  return `<div class="pane"><div class="ph"><span>${title}</span>${extra}</div>
    ${ic?`<div class="row"><span>IC 均值</span><span>${fmt(ic.ic_mean_1d,4)}</span></div>
    <div class="row"><span>t 统计量</span><span>${fmt(ic.ic_tstat,2)}</span></div>
    <div class="row"><span>ICIR(日/年)</span><span>${fmt(ic.icir_daily,3)} / ${fmt(ic.icir_annual,2)}</span></div>
    <div class="row"><span>月度胜率</span><span>${pct(ic.monthly_win_rate)} (${ic.n_months}月)</span></div>
    <div class="row"><span>覆盖率</span><span>${pct(ic.coverage)}</span></div>`:''}
    ${lm?`<div class="row"><span>分层单调性</span><span>${fmt(lm.monotonicity,3)}</span></div>`:''}
    ${ls?`<div class="row"><span>多空 Sharpe</span><span>${fmt(ls.sharpe,3)}</span></div>
    <div class="row"><span>扣费后 Sharpe</span><span>${fmt(ls.sharpe_net,3)}</span></div>
    <div class="row"><span>扣费后年化</span><span>${pct(ls.ann_return_net)}</span></div>
    <div class="row"><span>最大回撤</span><span>${pct(ls.max_drawdown)}</span></div>
    <div class="row"><span>日均换手</span><span>${fmt(ls.turnover_daily,3)}</span></div>`:''}
    ${lm?bars(lm.layer_ann_returns):''}</div>`;
}

function showEvals(){
  const nP=evals.filter(e=>e.status==='PASS').length;
  const nS=evals.filter(e=>e.status==='SKIP_NO_DATA').length;
  const nT=evals.length-nS;
  const badge=nS?`${nP}/${nT} 通过 · ${nS} 未测`:`${nP}/${nT} 通过`;
  panel('pEval',`<h3>回测结果 <span class="badge">${badge}</span></h3>
    ${evals.map(e=>{
      const sk=e.status==='SKIP_NO_DATA', p=e.status==='PASS';
      const cls=sk?'skip':(p?'pass':'fail');
      const dec=e.sharpe_decay!=null?`<span>衰减 ${(e.sharpe_decay*100).toFixed(1)}%</span>`:'';
      const desc=e.zh_what||e.description||'';
      const descLine=desc?`<div class="fxdesc">${esc(desc)}</div>`:'';
      if(sk) return `<div class="fx skip">
        <div class="hd"><span class="nm">${esc(e.factor_name)}</span>
          <span class="tag skip">未测（数据缺失）</span></div>
        ${descLine}
        <div class="reason">${esc(e.fail_reason)}</div></div>`;
      return `<div class="fx ${cls}">
        <div class="hd"><span class="nm">${esc(e.factor_name)}</span>
          <span class="tag ${p?'pass':'fail'}">${e.status}</span></div>
        ${descLine}
        ${e.nav&&e.nav.length?sparkline(e.nav):''}
        <div class="cmp">${pane('样本内 IS',e.is_ic,e.is_layers)}${pane('样本外 OOS',e.oos_ic,e.oos_layers,dec)}</div>
        ${e.fail_reason?`<div class="reason">${esc(e.fail_reason)}</div>`:''}
      </div>`}).join('')}`);
}
